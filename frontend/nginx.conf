# ============================================================
# 前端 Nginx 配置
# - 公网访问入口：http://服务器IP/boss_processing/
# - /api 前缀请求反代到后端（前端 baseURL='/api'，无需改前端代码）
# - 根路径 / 也直接可访问（Vite 产物 asset 为绝对路径 /assets/...）
# ============================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---------- 子路径入口：/boss_processing ----------
    # 访问 http://IP/boss_processing/ 时，alias 到前端静态目录
    location /boss_processing/ {
        alias /usr/share/nginx/html/;
        # Vue Router history 模式：刷新 /boss_processing/jobs 等路由时回退到 index.html
        try_files $uri $uri/ /boss_processing/index.html;
    }
    # 无尾斜杠时补全
    location = /boss_processing {
        return 301 /boss_processing/;
    }

    # ---------- 根路径：直接访问 IP 也重定向到子路径 ----------
    location = / {
        return 301 /boss_processing/;
    }
    # 根路径静态资源（/assets/... 等绝对路径引用）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- API 反代到后端（含 SSE 流式日志 / AI 对话流） ----------
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 长连接需要关闭缓冲、加长超时
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # ---------- 静态资源缓存 ----------
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
}