# ============================================================
# 本地代码 push 到 main 后，自动构建 backend / frontend 镜像并推送到阿里云 ACR
# 服务器上的 Watchtower 轮询到新 latest 后自动更新。
#
# 隐私说明：
#   - 本 workflow 不包含任何 .env 内容（.env 已被 .gitignore 忽略，不会入库）；
#   - 运行配置（MySQL 密码 / LLM Key 等）在服务器端 /opt/boss/.env 中维护，
#     由 docker-compose.yml 的 env_file 注入容器。
#
# 需要在 GitHub 仓库配置 4 个 Secrets：
#   ACR_REGISTRY   = registry.cn-hangzhou.aliyuncs.com
#   ACR_NAMESPACE  = boss-processing
#   ACR_USERNAME   = 阿里云账号全名（或 RAM 子账号）
#   ACR_PASSWORD   = ACR 访问凭证固定密码
# ============================================================

name: build-and-push

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: |
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/backend:latest
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/frontend:latest
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max